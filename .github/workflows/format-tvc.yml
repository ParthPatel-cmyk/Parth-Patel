name: Reformat TVC project

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-tvc.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reformat TVC project and organize assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          for f in parth-portrait.jpg tvc-front.jpg tvc-side.jpg tvc-detail.jpg nss-logo.png; do
            if [ -f "$f" ]; then
              mv "$f" "assets/$f"
            fi
          done

          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          old_gallery = '''<div class="visual"><div class="visual-main"><img src="tvc-front.jpg" alt="2-axis thrust vector control mechanism, 3D printed and assembled with servo motors"></div><div class="visual-row"><div><img src="tvc-side.jpg" alt="TVC side view"></div><div><img src="tvc-detail.jpg" alt="TVC wiring and servo detail"></div></div></div>'''
          new_gallery = '''<div class="visual tvc-gallery"><div class="tvc-shot"><img src="assets/tvc-front.jpg" alt="2-axis thrust vector control mechanism, front view"></div><div class="tvc-shot"><img src="assets/tvc-side.jpg" alt="2-axis thrust vector control mechanism, angled view"></div><div class="tvc-shot"><img src="assets/tvc-detail.jpg" alt="2-axis thrust vector control mechanism with Arduino and servo wiring"></div></div>'''
          if old_gallery not in s:
              raise SystemExit('Could not find current TVC gallery markup')
          s = s.replace(old_gallery, new_gallery, 1)

          old_copy = '<div class="project-copy"><div class="meta"><span>01 / FLIGHT HARDWARE</span>'
          new_copy = '<div class="project-copy tvc-copy"><div class="meta"><span>01 / FLIGHT HARDWARE</span>'
          if old_copy not in s:
              raise SystemExit('Could not find TVC project copy block')
          s = s.replace(old_copy, new_copy, 1)

          s = s.replace('src="parth-portrait.jpg"', 'src="assets/parth-portrait.jpg"')
          s = s.replace('src="nss-logo.png"', 'src="assets/nss-logo.png"')

          css = r'''
/* TVC gallery: equal image frames, no cropping */
.tvc-gallery{display:grid;grid-template-rows:repeat(3,280px);gap:2px;min-height:0;background:var(--line);align-self:stretch}
.tvc-gallery .tvc-shot{min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0a0f15}
.tvc-gallery .tvc-shot img{width:100%;height:100%;object-fit:contain;object-position:center;display:block}
.tvc-copy{display:flex;flex-direction:column;min-height:100%}
.tvc-copy .iteration{margin-top:38px;padding:24px;border:1px solid var(--line);background:rgba(9,14,20,.58)}
.tvc-copy .iteration h4{font-size:1.35rem;margin-bottom:14px}
.tvc-copy .iteration-steps{gap:10px}
.tvc-copy .istep{background:rgba(7,10,14,.45)}
@media(max-width:850px){.tvc-gallery{grid-template-rows:repeat(3,320px)}.tvc-copy .iteration{margin-top:30px}}
@media(max-width:520px){.tvc-gallery{grid-template-rows:repeat(3,270px)}.iteration-steps{grid-template-columns:1fr}}
'''
          if '/* TVC gallery: equal image frames, no cropping */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          p.write_text(s)
          PY

          rm -f .github/workflows/format-tvc.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve TVC gallery and design iteration layout"
          git push origin HEAD:main
