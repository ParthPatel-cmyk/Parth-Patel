name: Materialize resume asset
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact resume PDF and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib
          root = pathlib.Path('.')
          files = [root / 'assets/resume/00.txt'] + [root / f'assets/resume/{i:02d}.txt' for i in range(1,12)]
          chunks=[]
          for p in files:
              s=''.join(p.read_text().split())
              chunks.append(s)
          full=''.join(chunks)
          expected_size=125389
          expected_hash='6fcc1351088bea31afb06d0ceeb0f39eb9418629308bfee9ce4be74701623117'
          boundaries=[]
          n=0
          for c in chunks[:-1]:
              n += len(c)
              boundaries.append(n)
          candidates={0, len(full)-12}
          for b in boundaries:
              for off in range(-64,65):
                  pos=b+off
                  if 0 <= pos <= len(full)-12:
                      candidates.add(pos)
          found=None
          for pos in sorted(candidates):
              candidate=full[:pos]+full[pos+12:]
              if len(candidate) != 167188:
                  continue
              try:
                  data=base64.b64decode(candidate, validate=True)
              except Exception:
                  continue
              if len(data)==expected_size and hashlib.sha256(data).hexdigest()==expected_hash:
                  found=(pos,data)
                  break
          if not found:
              raise SystemExit('Could not reconstruct exact uploaded resume from staging chunks')
          pos,data=found
          print(f'Found duplicated 12-character overlap at base64 position {pos}')
          out=root/'assets/parth-patel-resume.pdf'
          out.write_bytes(data)
          print(f'PDF_SIZE={len(data)}')
          print(f'PDF_SHA256={hashlib.sha256(data).hexdigest()}')
          PY
          rm -rf assets/resume
          rm -f resume.html resume-source.txt
          rm -f .github/workflows/materialize-resume.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add resume PDF to assets and remove workaround"
          git push origin HEAD:main
