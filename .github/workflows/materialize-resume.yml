name: Materialize resume asset
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose resume staging
        shell: bash
        run: |
          set -u
          mkdir -p assets
          cat assets/resume/00.txt \
              assets/resume/01.txt assets/resume/02.txt assets/resume/03.txt assets/resume/04.txt \
              assets/resume/05.txt assets/resume/06.txt assets/resume/07.txt assets/resume/08.txt \
              assets/resume/09.txt assets/resume/10.txt assets/resume/11.txt \
            | tr -d '\r\n\t ' > /tmp/resume.b64
          echo "B64_SIZE=$(wc -c < /tmp/resume.b64)"
          if base64 --decode /tmp/resume.b64 > /tmp/resume.pdf; then
            echo "DECODE=ok"
            echo "PDF_SIZE=$(wc -c < /tmp/resume.pdf)"
            echo -n "PDF_SHA256="
            sha256sum /tmp/resume.pdf | cut -d' ' -f1
          else
            echo "DECODE=failed"
          fi
          echo "EXPECTED_SIZE=125389"
          echo "EXPECTED_SHA256=6fcc1351088bea31afb06d0ceeb0f39eb9418629308bfee9ce4be74701623117"
          exit 1
