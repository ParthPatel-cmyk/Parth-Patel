name: Materialize resume asset
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact resume PDF and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          tr -d '\r\n\t ' < assets/resume/00.txt > /tmp/resume-first.b64
          head -c 20000 /tmp/resume-first.b64 > /tmp/resume.b64
          cat assets/resume/01.txt assets/resume/02.txt assets/resume/03.txt assets/resume/04.txt \
              assets/resume/05.txt assets/resume/06.txt assets/resume/07.txt assets/resume/08.txt \
              assets/resume/09.txt assets/resume/10.txt assets/resume/11.txt \
            | tr -d '\r\n\t ' >> /tmp/resume.b64
          test "$(wc -c < /tmp/resume.b64)" -eq 167188
          base64 --decode /tmp/resume.b64 > assets/parth-patel-resume.pdf
          test "$(wc -c < assets/parth-patel-resume.pdf)" -eq 125389
          echo "6fcc1351088bea31afb06d0ceeb0f39eb9418629308bfee9ce4be74701623117  assets/parth-patel-resume.pdf" | sha256sum -c -
          rm -rf assets/resume
          rm -f resume.html resume-source.txt
          rm -f .github/workflows/materialize-resume.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add resume PDF to assets and remove workaround"
          git push origin HEAD:main
