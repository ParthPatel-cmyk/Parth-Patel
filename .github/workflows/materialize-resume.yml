name: Materialize resume asset
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact resume PDF and clean staging files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          python3 - <<'PY'
          import hashlib, pathlib
          src=pathlib.Path('assets/resume/p0.txt').read_bytes()
          target='074be000353ecce48bc4fde2590a317f20cfc8c8'
          def gitsha(b):
              return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          fixed=None
          for i in range(len(src)-7):
              c=src[:i]+src[i+8:]
              if len(c)==1000 and gitsha(c)==target:
                  fixed=c
                  break
          if fixed is None:
              raise SystemExit('Could not repair first resume prefix chunk')
          pathlib.Path('/tmp/p0.txt').write_bytes(fixed)
          print('Verified first 1000 base64 characters')
          PY
          cat /tmp/p0.txt assets/resume/p1.txt assets/resume/p2.txt assets/resume/p3.txt assets/resume/p4.txt \
              assets/resume/000b.txt assets/resume/00b.txt \
              assets/resume/01.txt assets/resume/02.txt assets/resume/03.txt assets/resume/04.txt \
              assets/resume/05.txt assets/resume/06.txt assets/resume/07.txt assets/resume/08.txt \
              assets/resume/09.txt assets/resume/10.txt assets/resume/11.txt > /tmp/resume.b64
          test "$(wc -c < /tmp/resume.b64)" -eq 167188
          base64 --decode /tmp/resume.b64 > assets/parth-patel-resume.pdf
          test "$(wc -c < assets/parth-patel-resume.pdf)" -eq 125389
          echo "6fcc1351088bea31afb06d0ceeb0f39eb9418629308bfee9ce4be74701623117  assets/parth-patel-resume.pdf" | sha256sum -c -
          rm -rf assets/resume
          rm -f resume.html resume-source.txt
          rm -f .github/workflows/materialize-resume.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add resume PDF to assets and remove workaround"
          git push origin HEAD:main
